services:
  media-bot:
    build: .
    container_name: media-mgmt-bot
    restart: unless-stopped
    env_file: bot.env
    volumes:
      # Same .env the MCP server uses: Sonarr/Radarr URLs, API keys, folders, profiles.
      - ./.env:/app/.env:ro
      - claude-state:/data
      # Host time zone, so air times from the calendar tools are local.
      - /etc/localtime:/etc/localtime:ro

volumes:
  claude-state:
