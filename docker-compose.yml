services:
  media-bot:
    build: .
    container_name: media-mgmt-bot
    restart: unless-stopped
    env_file: bot.env
    volumes:
      # Same .env the Mac uses: Sonarr/Radarr URLs, API keys, folders, profiles.
      - ./.env:/app/.env:ro
      - claude-state:/data
    networks:
      macvlan:
        ipv4_address: 192.168.0.213
        mac_address: 02:42:c0:a8:00:d5

volumes:
  claude-state:

networks:
  macvlan:
    external: true
